# Corrected-corpus Llama 3.1-70B rerun using public prequantized 4-bit base weights.
# This avoids the ~140 GB full-precision download on disk-limited Colab, but the
# quantization source differs from the older 70B run and must be reported.
dataset:
  repo_id: UlyssesLynne/urban_planning_llm
  revision: 775783b5b652a710182b3f1a871e231c5516d942
  subdir: data/revision_v6_prompt_cleaned

training:
  model_key: llama31_70b
  run_id: revision-v6-llama31-70b-prompt-cleaned-v1
  artifact_root: /content/urban_science_artifacts
  model_repo_id: UlyssesLynne/urban-planning-llm-model-zoo-v3
  publish_to_hf: true
  use_chat_template: true
  max_source_length: 512
  max_target_length: 384
  per_device_train_batch_size: 6
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 3
  num_train_epochs: 1
  learning_rate: 0.00005
  warmup_ratio: 0.03
  weight_decay: 0.0
  logging_steps: 10
  eval_steps: 25
  save_steps: 25
  save_total_limit: 2
  early_stopping_patience: 4
  early_stopping_threshold: 0.001
  random_seed: 42
  bf16: true
  fp16: false

evaluation:
  model_key: llama31_70b
  artifact_root: /content/urban_science_artifacts
  prediction_repo_id: UlyssesLynne/urban-planning-llm-predictions-v3
  publish_to_hf: true
  use_chat_template: true
  batch_size: 8
  metric_batch_size: 8
  metric_device: cuda
  checkpoint_uri: UlyssesLynne/urban-planning-llm-model-zoo-v3
  checkpoint_subfolder: llama31_70b/revision-v6-llama31-70b-prompt-cleaned-v1/checkpoint

model_registry:
  model_id: unsloth/Meta-Llama-3.1-70B-Instruct-bnb-4bit
  family: causal_lm
  load_in_4bit: true
  use_lora: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
